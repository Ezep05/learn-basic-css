<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
</head>
<style>
    [title="text-aligment"] {
        text-align: center;
    }
    [title="text-decoration"] {
        text-decoration: line-through;
    }
    [title='text-transform'] {
        text-transform: uppercase;
    }
    [title="text-indent"] {
        text-indent: 1cm;
    }
    [title="letter-spacing"] {
        letter-spacing: 2cap;
    }
    [title="line-height"] {
        line-height: 2;
    }
    [title="word-spacing"] {
        word-spacing: 100%;
    }
    [title="white-space"] {
        white-space: pre;
    }
    [title="text-shadow"] {
        text-shadow: 2px 2px 5px red;
    }
</style>
<body>
    <p title="text-alignment">Text Alignment</p>
    <p title="text-decoration">Text Decoration</p>
    <p title="text-transform">Text Transform</p>
    <p title="text-indent">Text Indent</p>
    <p title="letter-spacing">Letter Spacing</p>
    <p title="line-height">Line Height</p>
    <p title="word-spacing">Word Spacing</p>
    <p title="white-space">White Space</p>
    <p title="text-shadow">Text Shadow</p>
</body>
</html>
