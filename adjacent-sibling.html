<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjacent Sibling</title>
</head>
<style>
    div + p {
        color: red;
    }
</style>
<body>
    <div>
        <article>
            <p>Ini Tidak</p>
        </article>
        <p>Ini Tidak</p>
    </div>
    <p>Ini Dipilih</p>
</body>
</html>
