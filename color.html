<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
</head>
<style>
    [title="biasa"] {
        color: red;
    }
    [title="hex"] {
        color: #10981d;
    }
    [title="rgb"] {
        color: rgb(0, 0, 255);
    }
    [title="hsl"] {
        color: hsl(240, 100%, 50%);
    }
</style>
<body>
    <p title="biasa">Biasa</p>
    <p title="hex">HEX</p>
    <p title="rgb">RGB</p>
    <p title="hsl">HSL</p>
</body>
</html>
