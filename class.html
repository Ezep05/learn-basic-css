<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class & Multiple Class</title>
</head>
    <style>
        .red {
            color: red;
        }
        .upper {
            text-transform: uppercase;
        }
        .blue {
            color: blue;
        }
    </style>
<body>
    <section>
        <h1 class="red">Ini Adalah Judul</h1>
        <h2 class="red">Ini Adalah Sub Judul</h2>
        <p class="red">Ini adalah isi</p>
    </section>

    <section>
        <h1 class="blue upper">Ini Adalah Judul</h1>
        <h2 class="blue upper">Ini Adalah Sub Judul</h2>
        <p class="blue">Ini adalah Isi</p>
    </section>
</body>
</html>
