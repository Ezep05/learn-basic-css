    <title>General Sibling</title>

<style>
    div ~ p {
        color: red;
    }
</style>
<body>
    <div>
        <article>
            <p>INI</p>
        </article>
        <p>INI</p>
    </div>
    <p>INI</p>
    <p>INI</p>
</body>
